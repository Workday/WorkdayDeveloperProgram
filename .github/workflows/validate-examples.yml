name: Validate examples

# Runs on every pull request because it is a required check on main. It
# takes a few seconds, so there is no reason to skip it.
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate example metadata and README index
        run: node scripts/validate-examples.mjs --check
