# Deploys the optional gallery site (site/) to GitHub Pages.
#
# The gallery is an option, not a dependency: nothing else in this repo
# relies on it. To go live: enable GitHub Pages in the repo settings
# (source: GitHub Actions), then run this workflow manually from the
# Actions tab. When you want automatic deploys on every merge, add a
# push trigger:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:

name: Deploy gallery

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: site
      - name: Build site
        run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
